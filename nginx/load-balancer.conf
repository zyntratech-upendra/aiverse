# ==============================================================================
# AI Verse High-Performance Nginx Reverse Proxy & Load Balancer Configuration
# ==============================================================================

# Rate limiting zones to protect during mass registration spikes
limit_req_zone $binary_remote_addr zone=api_burst_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=registration_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

# Microcache zone for public read endpoints (events, team, settings)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=aiverse_cache:20m max_size=500m inactive=60m use_temp_path=off;

# Upstream Backend Cluster with Keepalive Connection Pooling
upstream aiverse_backend_cluster {
    # Load balancing method: least_conn directs traffic to the least-busy worker
    least_conn;

    # Primary Backend Instances (can scale horizontally across ports or containers)
    server 127.0.0.1:4000 weight=3 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4001 weight=3 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4002 weight=3 max_fails=3 fail_timeout=10s;

    # Keepalive idle connections to eliminate TCP handshake latency on every request
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiversevitb.in www.aiversevitb.in localhost;

    # Client Request Limits
    client_max_body_size 25M;
    client_body_buffer_size 512k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip Compression for Ultra-Fast Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. API Reverse Proxy & Load Balancer
    location /api/ {
        # Rate limit protection with smooth burst queue
        limit_req zone=api_burst_limit burst=100 nodelay;
        limit_conn addr_conn_limit 50;

        proxy_pass http://aiverse_backend_cluster;
        proxy_http_version 1.1;

        # Connection Keep-Alive headers
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts tuned for high load
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Microcaching for high-traffic public GET routes (Events, Team)
        proxy_cache aiverse_cache;
        proxy_cache_bypass $http_authorization $http_pragma;
        proxy_no_cache $http_authorization $http_pragma;
        proxy_cache_valid 200 302 10s;
        proxy_cache_valid 404 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 2. Registration Endpoint Dedicated Priority Route
    location /api/registrations {
        limit_req zone=registration_limit burst=50 nodelay;

        proxy_pass http://aiverse_backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bypass caching entirely for transactional registration writes
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 3. Health Check Probe
    location /health {
        proxy_pass http://aiverse_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # 4. Frontend Static Files & SPA Routing
    location / {
        root /var/www/aiverse/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Aggressive Browser Caching for Hashed Static Assets (Vite chunks)
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|webp|svg|gif)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # No-cache for HTML files to guarantee instant deployment updates
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
